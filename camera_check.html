<!DOCTYPE html>
<html>
<head>
    <title>Camera Check</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            text-align:center;
        }

        .container{

            width:600px;
            margin:auto;
            margin-top:50px;

        }

        video{

            width:500px;
            border:3px solid #333;

        }

        button{

            padding:12px 25px;
            font-size:18px;
            margin-top:20px;

        }

        #status{

            font-size:20px;
            color:green;
            margin-top:20px;

        }

    </style>

</head>

<body>

<div class="container">

<h2>Camera Permission</h2>

<p>Please allow camera access.</p>

<video id="video" autoplay></video>

<br>

<button onclick="startCamera()">

Allow Camera

</button>

<p id="status"></p>

</div>

<script>

let stream;

function startCamera(){

navigator.mediaDevices.getUserMedia({

video:true

})

.then(function(mediaStream){

stream=mediaStream;

document.getElementById("video").srcObject=stream;

document.getElementById("status").innerHTML="✔ Camera Connected";

setTimeout(function(){

window.location.href="/mic-check";

},2000);

})

.catch(function(){

alert("Camera permission denied.");

});

}

</script>

</body>
</html>
